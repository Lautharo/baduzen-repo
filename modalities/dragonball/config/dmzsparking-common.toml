
#How this mod behaves next to other DragonMineZ add-ons.
#Whoever else brings the same content gets it, unless you say otherwise here.
[compatibility]

	#Dragon Block Noea (noeabosses).
	#Both mods define the same nine transformation groups: godforms, beastforms,
	#frostgodforms, friezabiodata, piccolobiodata, bioevolution, superforms,
	#ultraego and ultrainstinct. Whichever writes last wins, which is why forms
	#went missing or showed up twice.
	#true  - install our versions of those groups
	#false - leave them to Dragon Block Noea (default)
	[compatibility.noea]
		forms = false
		#Dragon Block Noea brings a Beerus planet as well - 12802 pieces of its
		#own. Ours is a separate dimension, so both would stand side by side.
		#true  - unlock our Beerus planet as well
		#false - leave the planet to Dragon Block Noea (default)
		beerusPlanet = false

	#DragonMineZ Super (dmzsuper).
	#DragonMineZ itself hands the Beerus planet to this mod: its own space pod
	#destination 'beerus' points at the dimension dmzsuper:beerus_planet. With
	#dmzsuper installed our planet would be a second, identical-looking entry.
	#true  - unlock our Beerus planet as well
	#false - leave the planet to DragonMineZ Super (default)
	[compatibility.dmzsuper]
		beerusPlanet = false
		#DragonMineZ Super also defines the groups ultraego and ultrainstinct,
		#with the same group and form names as ours but different values. Whichever
		#writes last wins.
		#true  - install our versions of those two groups
		#false - leave them to DragonMineZ Super (default)
		forms = false

#Flight.
[flight]
	#How fast Combat Flight sinks when you hold neither ascend nor descend,
	#in blocks per tick.
	#DragonMineZ hard-codes 0.05, which is a block a second downwards - so holding
	#jump is not how you climb, it is how you avoid falling. Aiming, charging and
	#dodging all happen during a permanent slow descent.
	#0.0  - hold your height (default). Search Flight stays the fast way to travel,
	#       Combat Flight becomes the one you fight in.
	#0.05 - DragonMineZ' behaviour.
	#Anything in between works; the value is used as-is.
	#Range: 0.0 ~ 1.0
	combatFlightSink = 0.0
	#How many ticks the flight aura keeps burning after the sprint
	#threshold drops, in ticks.
	#DragonMineZ switches the aura by 'fly skill active AND sprinting AND faster
	#than 0.65 blocks per tick', re-decided every server tick. It does fade out
	#rather than cut, but there is no hold - every corner, every brake, every
	#moment the speed grazes the threshold turns the fade around, so a short burst
	#never reaches full brightness.
	#20 - one second of hold (default). 0 - DragonMineZ' behaviour.
	#This is render-only: the aura you see is held, nothing else. The server flag
	#also grants the turbo speed bonus and the aura light level, and neither is
	#touched here.
	#Range: 0 ~ 200
	auraLatchTicks = 20
	#How many aura particles sweep back from a flying player per tick.
	#This is the anime silhouette: the ki aura is not a flame standing over your
	#head while you fly, it lies back along the body into a plume. Built from
	#DragonMineZ' own aura particle at DragonMineZ' own measurements - ring radius
	#0.15 to 0.60 of the body scale, two blocks long, tapering towards the tail.
	#DragonMineZ spawns 0 to 2 of these per tick for a standing aura, and only for
	#whitelisted players, so nothing is drawn twice.
	#2 - a steady plume (default). 0 - off.
	#Range: 0 ~ 12
	auraSweepPerTick = 2
	#Size of the swept aura particles, as a multiple of the body scale.
	#1.0 is DragonMineZ' own size for its standing aura (default).
	#Range: 0.1 ~ 4.0
	auraSweepScale = 1.0
	#How many fine ki motes a flying player leaves per tick.
	#DragonMineZ' own ki_trail particles - the same specks its ki attacks shed -
	#tinted with that player's aura colour. They are the speed lines next to the
	#plume. Nothing here is drawn as geometry, so it stays inside the game's own
	#visual language, and none of it needs network traffic: everyone's position is
	#known anyway.
	#2 - a thin stream (default). 0 - no motes.
	#Range: 0 ~ 12
	trailsPerTick = 2
	#How large the trail particles are.
	#DragonMineZ' own scale factor: the particle picks a random size between 0.1
	#and 0.4 times this value, so it is a ceiling rather than a fixed size.
	#0.6 - clearly visible, not loud (default).
	#Range: 0.05 ~ 3.0
	trailScale = 0.6
	#How fast a flying player has to move before a trail appears, in blocks
	#per tick.
	#Gates both the plume and the motes. Deliberately not tied to DragonMineZ' aura
	#switch: that one also demands the sprint key and 0.65 blocks per tick, so
	#anything hung on it would stay invisible most of the time.
	#0.35 - a brisk flight (default). Lower means effects almost always.
	#Range: 0.0 ~ 3.0
	trailMinSpeed = 0.35

#Lock-on targeting.
#Who can be locked stays DragonMineZ' decision: the kisense skill, its range
#of 15 + 5 per level (+25 when android-upgraded), cloaked players, god forms
#and Taiyoken blindness all keep working exactly as before. Only the choice of
#target among those changes.
[lockOn]
	#Half-angle of the search cone in degrees, measured from where you look.
	#DragonMineZ casts a single ray down the crosshair, so a target has to sit
	#almost exactly under it and the nearest one along that ray always wins - a
	#saibaman in front hides the boss behind it.
	#45.0 - the quadrant in front of you (default).
	#Small values approach DragonMineZ' behaviour, large ones let targets behind
	#your shoulder in.
	#Range: 1.0 ~ 90.0
	coneDegrees = 45.0
	#How much battle power counts when several targets are in the cone.
	#The bonus is capped at a hundredfold difference either way and is worth at
	#most this value, so it decides near-ties and can never pull the lock off
	#something you are clearly aiming at.
	#0.5 - a tenfold stronger opponent wins ties worth about 9 degrees (default).
	#0.0 - angle and distance only.
	#Range: 0.0 ~ 5.0
	powerWeight = 0.5
	#How many ticks a lock survives losing line of sight.
	#DragonMineZ drops the target the moment anything comes between you, which in
	#a fight means every pillar, every dash behind cover.
	#40 - two seconds (default). 0 - drop it at once, as DragonMineZ does.
	#Everything else still applies during the grace: range, cloak, death and
	#Taiyoken end the lock immediately.
	#Range: 0 ~ 200
	occlusionGraceTicks = 40

#What this mod writes into DragonMineZ' own config files.
[prices]
	#Whether a price you have edited yourself is left alone.
	#
	#This mod adds transformation groups and ki techniques that DragonMineZ does
	#not have, so it has to write their prices into skills.json and character.json
	#- otherwise they would have no price at all and could never be bought.
	#
	#Until 01.09.2026 it wrote them on EVERY start, which meant it also wrote them
	#back over anything you had changed. Two modpack makers reported the same
	#thing: edit the cost of legendaryforms or of a ki attack, restart, and it is
	#our number again. That was a bug, not a policy.
	#
	#true  - write a price only when there is none yet, then never touch it again.
	#        Your edits survive every restart. This is the default.
	#false - write our prices on every start. Use this if you have edited something
	#        into a mess and want our defaults back, or if you want to follow our
	#        numbers as they change between versions.
	keepEditedPrices = true

#The balance of the transformation forms this mod adds.
[forms]
	#Which balance profile our own forms follow. DragonMineZ' own forms are never touched.
	#
	#classic  - the numbers before 07.09.2026 (stack forms as strong as top forms;
	#           Cell Max plus Black reaches x50). Kept as the way back.
	#sparking - stack forms in DragonMineZ' own range, top forms flatter; the strongest
	#           combination of every race lands between x9 and x14. The default. See Doku/62.
	#
	#Switching writes only the six balance fields of our forms, and only where they still
	#carry exactly the numbers of a profile this jar ships. A form you edited yourself is
	#kept and named in the log - this switch is not consent to overwrite your work.
	balanceProfile = "sparking"

#Fighting in the ring.
[arena]
	#Whether stepping off the ring loses the fight.
	#
	#A Tenkaichi ring counts the grass around it as out; the Tournament of Power
	#counts falling off the platform. That is the rule that makes a ring a ring -
	#between two players.
	#
	#IT WAS OFF AGAINST THE ROSTER UNTIL 02.09.2026, and for a reason that has
	#since been fixed rather than a reason that was true. The rule used to read
	#the arena's markers as if they named the floor, so a fighter standing on his
	#own starting mark was already 'outside' - and losing that way is not the
	#fight anybody came for. It reads the ground now: grass is out, the platform
	#is in, and being thrown off is a defeat you can see coming.
	#
	#true  - out of the ring loses (default).
	#false - the fight ends on the fighters only.
	ringOutPlayerVersusPlayer = true
	ringOutAgainstFighters = true
	#Whether flight works inside the Tournament of Power ring.
	#
	#In the World of Void nobody flies - only a fighter with real wings. It is
	#not decoration: without it the platform has no edge worth falling off, and
	#a ring nobody can fall out of is a floor with a fight on it.
	#
	#Only during that fight, only in that ring, and only for the two in it.
	#Everybody watching keeps their flight, and so does the whole rest of the
	#world.
	#
	#false - no flight while the bell is up (default, and the series' rule).
	#true  - fly as usual; the platform is then merely somewhere to stand.
	flightInTournamentOfPower = false

#Majin absorption.
#DragonMineZ grants four percent of the target's max health as a flat bonus on
#STR, SKP and PWR. Against a saga fighter that is a few dozen points against
#your thousands - it happens, but nobody ever feels it. This is a multiplier
#on every stat instead, active only while an absorbed form is worn.
[absorption]
	#How much of the absorbed fighter you keep, as a share of their stats.
	#Against a player this is exactly that: a quarter of their STR, SKP, RES, VIT,
	#PWR and ENE. An NPC carries a battle power but no stat spread, so the stats
	#are read back out of DragonMineZ' own curve - bp = 1200 * (rawPower/100)^1.2,
	#inverted. Its reference value of 1200 is Raditz' scouter reading, so the
	#numbers land where the anime put them: Raditz 20 per stat, Nappa 55, Vegeta
	#of the Saiyan saga 243, Mecha Frieza 10082.
	#Every absorption you carry counts, worn or not - a Majin gets stronger by
	#eating, not by changing clothes. Which one you wear is looks alone.
	#One absorption is capped at half your own value for that stat, so the three
	#DragonMineZ allows add up to +150 percent at most. Without the cap Perfect
	#Cell alone would hand you 797080.
	#The numbers are measured once, when you absorb, and stay put.
	#0.25 - a quarter (default). 0.0 - off.
	#Range: 0.0 ~ 2.0
	statShare = 0.25

#Diagnosis.
[diagnosis]
	#Counts every mob spawn and writes one summary line per minute,
	#broken down by entity and by the reason Forge gives: NATURAL is the world
	#spawning by itself, CHUNK_GENERATION is a herd placed when the terrain was
	#made, SPAWNER is a block, MOB_SUMMONED and COMMAND are somebody's code.
	#Counting what stands around only says how much accumulated - this says what
	#is arriving, and from where.
	#false - off (default). Turn it on when something is multiplying.
	spawnWatch = false

