
[space]
	#Shader-only space sun lens flare strength; 0 disables optical ghosts. Planets and terrain occlude the light.
	#Range: 0.0 ~ 2.0
	lensFlareStrength = 0.65

[pod]
	#Follow space pods only during engaged autopilot. Toggle Pro Cam with P (rebindable).
	cinematicCamera = true
	#Internal: migrate only the previous default F6 binding to P once; custom bindings are retained.
	proCamKeyMigrated = true

[nimbus]
	#Stand upright while riding either Nimbus cloud.
	standingPose = true

[deadSpace]
	#Distance beyond Y=400 or below Y=0 until celestial bodies disappear.
	#Range: 8.0 ~ 160.0
	fadeDistance = 48.0
	#Time smoothing of the dead-space fade; prevents boundary flicker during flight.
	#Range: 0.05 ~ 2.0
	fadeResponseSeconds = 0.35

#Small shoulder-camera marker used by long-range Super Dash targeting.
[thirdPersonReticle]
	#Show the marker while DMZ's rear shoulder camera is active.
	enabled = true
	#Length in GUI pixels of each arm.
	#Range: 1 ~ 12
	size = 3
	#Empty GUI pixels around the exact aim point.
	#Range: 0 ~ 8
	gap = 2
	#Arm thickness in GUI pixels.
	#Range: 1 ~ 4
	thickness = 1
	#RGB hex colour, for example #FFFFFF or #70D9FF.
	color = "#FFFFFF"
	#0.0 is invisible and 1.0 is fully opaque.
	#Range: 0.05 ~ 1.0
	opacity = 0.88
	#Horizontal distance from screen centre as a percentage of screen width.
	#The direction mirrors automatically when DMZ swaps shoulders.
	#Range: 0.0 ~ 15.0
	horizontalOffsetPercent = 3.35
	#Vertical distance from screen centre as a percentage of screen height.
	#Negative values move the marker up; positive values move it down.
	#Range: -15.0 ~ 15.0
	verticalOffsetPercent = 0.0

#Client-only cinematic rear-camera lag for server-approved Super Dash travel.
[superDashCamera]
	#Hold the rear camera at takeoff, then let it catch the player.
	enabled = true
	#Ticks from takeoff until the rear camera fully catches up.
	#20 ticks is approximately one second.
	#Range: 4 ~ 40
	catchupTicks = 20
	#0 disables positional lag; 1 uses the full takeoff anchor.
	#Range: 0.0 ~ 1.0
	lagStrength = 1.0

#Fine client-only screen-space alignment for DMZ's native fast-flight aura.
#Positive right values move the aura right; positive up values move it up.
[nativeFlightAura]
	#Additional level-flight right adjustment.
	#Range: -1.0 ~ 1.0
	levelRightAdjustment = 0.0
	#Additional level-flight up adjustment.
	#Range: -1.0 ~ 1.0
	levelUpAdjustment = 0.0
	#Additional 45-degree climb right adjustment.
	#Range: -1.0 ~ 1.0
	midClimbRightAdjustment = 0.0
	#Additional 45-degree climb up adjustment.
	#Range: -1.0 ~ 1.0
	midClimbUpAdjustment = 0.0
	#Additional full-climb right adjustment.
	#Range: -1.0 ~ 1.0
	climbRightAdjustment = 0.0
	#Additional full-climb up adjustment.
	#Range: -1.0 ~ 1.0
	climbUpAdjustment = 0.0
	#Additional 45-degree dive right adjustment.
	#Range: -1.0 ~ 1.0
	midDiveRightAdjustment = 0.0
	#Additional 45-degree dive up adjustment.
	#Range: -1.0 ~ 1.0
	midDiveUpAdjustment = 0.0
	#Additional full-dive right adjustment.
	#Range: -1.0 ~ 1.0
	diveRightAdjustment = 0.0
	#Additional full-dive up adjustment.
	#Range: -1.0 ~ 1.0
	diveUpAdjustment = 0.0
	#Only show the Search Flight aura/trail while Ki Charge is held for the speed boost.
	#Disable this to retain the continuous fast-flight aura behavior.
	onlyWhileCharging = true

#Client-only Close Range Combat presentation. Gameplay remains server-owned.
[closeRangeCombat]
	#Show supplied punch, spark, dust, explosion and flash sprite sequences.
	effectsVisible = true
	#Chance/scale multiplier for combat particles. 0 hides particles; 1 is full density.
	#Range: 0.0 ~ 1.0
	effectDensity = 1.0
	#Opacity and size multiplier for brief clash/finisher flashes.
	#Range: 0.0 ~ 1.0
	flashIntensity = 0.75
	#Restrained hit shake strength. Set to 0 to disable.
	#Range: 0.0 ~ 1.0
	cameraShake = 0.2
	#Exchange camera yaw/orbit strength. Set to 0 to disable.
	#Range: 0.0 ~ 1.0
	exchangeCameraOrbitStrength = 0.35
	#Show a small central hit marker when sprite effects are hidden.
	minimalFeedbackWhenEffectsHidden = true

#Client-only staged presentation for validated ordinary Dance and Potara Fusion.
#Disabling this keeps the server-owned Fusion and the ordinary nearby-player fallback.
[fusionCinematics]
	#Show staged actors and participant camera presentation.
	enabled = true
	#Show comfortable cinematic bars for participants.
	letterbox = true
	#0 keeps the ordinary camera; 1 uses the complete bounded scene camera.
	#Range: 0.0 ~ 1.0
	cameraMotionStrength = 1.0
	#Black transition strength. Set to 0 for reduced visual effects.
	#Range: 0.0 ~ 1.0
	fadeIntensity = 1.0

#Client-only presentation for an existing server-approved Ultra Instinct dodge.
#This never changes dodge chance, stamina, timing or invulnerability.
[ultraInstinctDodge]
	#Presentation mode: full, reduced, or off.
	presentationMode = "full"
	#Play the supplied ordered Ultra Instinct dodge sounds.
	#Uses Minecraft's Players volume slider; /noea dodge_sound can also disable it per player.
	soundEnabled = true

#One-time ButterJaffa presentation preset for fresh/default client settings.
#Only untouched Minecraft FOV/GUI scale and DMZ camera/HUD defaults are changed.
#Existing customized values always win.
[creatorPresentationPreset]
	#Apply the creator camera/HUD preset once on this client.
	enabled = true

[celestial]
	#Star corona brightness; 0 disables the glow. No shader pack required.
	#Range: 0.0 ~ 3.0
	starGlow = 1.0
	#Outer corona radius relative to the visible star surface.
	#Range: 1.2 ~ 4.0
	starCoronaRadius = 2.8

[combat]
	#Show the server-confirmed five-contact combo gauge while experimental combat is active. Independent of guide text.
	comboGauge = true

