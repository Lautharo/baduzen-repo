
#Dragon Mine Z: Living World — client-only meditation presentation.
[meditationVisuals]
	#Show the meditation focus HUD.
	focusHud = true
	#Show a temporary non-chat summary after a meditation session.
	sessionSummary = true
	#Compatibility-only legacy value. The in-game summary now uses the established five-second duration.
	#Range: 2 ~ 15
	sessionSummarySeconds = 5
	#Use Dragon Mine Z's base.meditation animation when available.
	nativeDmzMeditationAnimation = true
	#Vertical position of the meditation HUD from the top of the screen.
	#Range: 0 ~ 240
	hudTopOffset = 12
	#Overall meditation effect intensity percentage. Visual only; this does not restore the removed extra aura layer.
	#Range: 0 ~ 250
	auraIntensityPercent = 100
	#Legacy compatibility toggle for the ground meditation effect; kept mapped to the Focus Seal.
	groundFocusCircle = true
	#Render the anime-style Focus Seal beneath the meditating character. It grows more elaborate with meditation depth.
	focusSealEnabled = true
	#Brightness/density of the Focus Seal beneath the character.
	#Range: 25 ~ 200
	focusSealIntensityPercent = 100
	#Size of the Focus Seal. 100 = normal.
	#Range: 60 ~ 160
	focusSealRadiusPercent = 100
	#Show a restrained aura at the edges of first-person view.
	firstPersonAura = true
	#Show stage-transition flashes/bursts when meditation deepens.
	stageTransitionEffects = true
	#Show Living World NPC meditation seals, particles and shared-bond effects. Client only.
	npcMeditationEffects = true

